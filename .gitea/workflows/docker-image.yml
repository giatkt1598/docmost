name: Build Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # the enterprise submodule (apps/server/src/ee) is not checked out
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure image name
        shell: bash
        run: |
          registry="${{ gitea.server_url }}"
          registry="${registry#https://}"
          registry="${registry#http://}"
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${registry}/${{ gitea.repository }}" >> "$GITHUB_ENV"

      - name: Set image tag
        id: image
        shell: bash
        run: |
          if [[ "${{ gitea.event_name }}" == "push" && "${{ gitea.ref }}" == "refs/heads/main" ]]; then
            # every push to main gets its own tag: main-<workflow run number>
            tag="main-${{ gitea.run_number }}"
          else
            # pull requests have refs like "12/merge"; docker tags allow [A-Za-z0-9_.-]
            tag="$(echo "${{ gitea.ref_name }}" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/-*$//')"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea Container Registry
        if: gitea.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.TOKEN }}

      # client settings are read at runtime from the server env, so no build args
      - name: Build Docker image
        run: |
          docker build \
            --tag "${IMAGE_NAME}:${{ steps.image.outputs.tag }}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA::12}" \
            --label "org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --file Dockerfile \
            .

      - name: Push Docker image
        if: gitea.event_name != 'pull_request'
        run: |
          docker push "${IMAGE_NAME}:${{ steps.image.outputs.tag }}"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA::12}"

          if [[ "${{ gitea.ref_name }}" == "main" ]]; then
            docker tag "${IMAGE_NAME}:${{ steps.image.outputs.tag }}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          fi

  # Deploy: write the new tag (main-<run>) into base/kustomization.yaml of giatk-k8s so Argo CD rolls it out.
  # Shared logic lives in admin/workflows; it only acts on pushes to the default branch.
  deploy:
    needs: build
    uses: admin/workflows/.gitea/workflows/k8s-bump.yml@v1
    with:
      default_branch: main
      tag_strategy: branch-run
    secrets:
      TOKEN: ${{ secrets.TOKEN }}
